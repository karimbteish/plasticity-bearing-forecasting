name: Reproduce static baselines

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download and verify pinned feature tables
        run: python code/fetch_features.py
      - name: Run persistence and ridge
        run: python code/baseline.py --data-dir data --out runs/ci
      - name: Check gradients and run static MLP
        run: python code/static_mlp.py --data-dir data --out runs/ci/results/static_mlp
      - name: Compare against reference results
        run: python scripts/check_reproduction.py --run-root runs/ci
